<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AJJRA Smart Home</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f3;
    color: #17201b;
}

.header {
    background: #087f5b;
    color: white;
    padding: 22px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 26px;
}

.header p {
    margin: 6px 0 0;
    opacity: .9;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

.connection {
    background: white;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.connection input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    margin-top: 8px;
    font-size: 16px;
}

.connect {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: #087f5b;
    color: white;
    font-size: 16px;
}

.status {
    margin-top: 10px;
    font-weight: bold;
}

.devices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.device {
    background: white;
    padding: 20px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.icon {
    font-size: 40px;
}

.device h3 {
    margin: 10px 0;
}

.switch {
    width: 70px;
    height: 36px;
    border: none;
    border-radius: 30px;
    background: #bbb;
    position: relative;
    cursor: pointer;
}

.switch::after {
    content: "";
    width: 28px;
    height: 28px;
    background: white;
    border-radius: 50%;
    position: absolute;
    top: 4px;
    left: 4px;
    transition: .2s;
}

.switch.on {
    background: #087f5b;
}

.switch.on::after {
    left: 38px;
}

.state {
    margin-top: 10px;
    font-weight: bold;
}

@media(max-width:430px) {

    .devices {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>

<div class="header">

<h1>🏠 AJJRA Smart Home</h1>

<p>NodeMCU Home Automation</p>

</div>

<div class="container">

<div class="connection">

<label>NodeMCU IP Address</label>

<input
id="ip"
placeholder="Example: 192.168.1.100">

<button class="connect"
onclick="connectNode()">
Connect NodeMCU
</button>

<div id="connectionStatus"
class="status">
🔴 Not Connected
</div>

</div>


<div class="devices">


<div class="device">

<div class="icon">💡</div>

<h3>Light 1</h3>

<button
id="relay1"
class="switch"
onclick="toggleRelay(1)">
</button>

<div id="state1" class="state">
OFF
</div>

</div>


<div class="device">

<div class="icon">💡</div>

<h3>Light 2</h3>

<button
id="relay2"
class="switch"
onclick="toggleRelay(2)">
</button>

<div id="state2" class="state">
OFF
</div>

</div>


<div class="device">

<div class="icon">🌀</div>

<h3>Fan</h3>

<button
id="relay3"
class="switch"
onclick="toggleRelay(3)">
</button>

<div id="state3" class="state">
OFF
</div>

</div>


<div class="device">

<div class="icon">🔌</div>

<h3>Socket</h3>

<button
id="relay4"
class="switch"
onclick="toggleRelay(4)">
</button>

<div id="state4" class="state">
OFF
</div>

</div>

</div>

</div>


<script>

let nodeIP = "";

let states = [
    false,
    false,
    false,
    false
];


function connectNode() {

    let ip = document.getElementById("ip").value.trim();

    if (!ip) {
        alert("Enter NodeMCU IP address");
        return;
    }

    nodeIP = ip;

    fetch("http://" + nodeIP + "/status")

    .then(response => response.json())

    .then(data => {

        states[0] = data.light1;
        states[1] = data.light2;
        states[2] = data.fan;
        states[3] = data.socket;

        updateUI();

        document.getElementById(
            "connectionStatus"
        ).innerHTML = "🟢 NodeMCU Connected";

    })

    .catch(error => {

        document.getElementById(
            "connectionStatus"
        ).innerHTML = "🔴 Connection Failed";

        alert(
            "NodeMCU connect ചെയ്യാൻ കഴിഞ്ഞില്ല.\n" +
            "IP address, Wi-Fi എന്നിവ പരിശോധിക്കുക."
        );

    });

}


function toggleRelay(id) {

    if (!nodeIP) {

        alert("ആദ്യം NodeMCU connect ചെയ്യുക");

        return;
    }

    let index = id - 1;

    let newState = !states[index];

    fetch(
        "http://" +
        nodeIP +
        "/relay?id=" +
        id +
        "&state=" +
        (newState ? 1 : 0)
    )

    .then(response => response.json())

    .then(data => {

        states[0] = data.light1;
        states[1] = data.light2;
        states[2] = data.fan;
        states[3] = data.socket;

        updateUI();

    })

    .catch(error => {

        alert("NodeMCU connection lost");

    });

}


function updateUI() {

    for (let i = 0; i < 4; i++) {

        let button =
            document.getElementById(
                "relay" + (i + 1)
            );

        let label =
            document.getElementById(
                "state" + (i + 1)
            );

        if (states[i]) {

            button.classList.add("on");

            label.innerHTML = "🟢 ON";

        } else {

            button.classList.remove("on");

            label.innerHTML = "⚫ OFF";

        }

    }

}

</script>

</body>
</html>
